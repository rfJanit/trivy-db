---
name: Trivy DB (RapidFort superset)
on:
  schedule:
    # Runs at :30 past every 6th hour, offset from vuln-list-update (which runs
    # at :00) so we pull fresh rapidfort JSON that this build's run just committed.
    - cron: "30 */6 * * *"
  workflow_dispatch:
env:
  # Upstream data lives at aquasecurity/vuln-list*, not under our fork's owner.
  # `make db-fetch-vuln-list` reads REPO_OWNER, so this pins fetches to upstream.
  REPO_OWNER: aquasecurity
  # Your own RapidFort data repo (populated by vuln-list-update's rapidfort target).
  RAPIDFORT_DATA_OWNER: ${{ github.repository_owner }}
  RAPIDFORT_DATA_REPO: vuln-list-trivy-rf
  VERSION: 2
permissions:
  contents: read
  packages: write  # for pushing to ghcr.io

jobs:
  build:
    name: Build DB
    runs-on: ubuntu-24.04
    steps:
      # vuln-list dirs + language repositories use more than 31GB of storage
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-cached-tools: 'true'
          remove-swapfile: 'true'

      - name: Check out code into the Go module directory
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod

      - name: Install bbolt
        run: go install go.etcd.io/bbolt/cmd/bbolt@v1.3.5

      - name: Download vuln-list and advisories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make db-fetch-langs db-fetch-vuln-list

      - name: Overlay RapidFort advisories onto vuln-list/
        # Downloads github.com/<owner>/vuln-list-trivy-rf and copies its `rapidfort/`
        # subtree into cache/vuln-list/rapidfort/ so trivy-db's rapidfort vulnsrc
        # picks it up alongside every upstream source. Fails loudly if the data
        # repo has no rapidfort/ tree — that would silently produce a rapidfort-less
        # DB, which is a superset-invariant violation (see RELEASE-GUIDE.md § 1.4).
        run: |
          set -euo pipefail
          tarball="/tmp/vlrf.tar.gz"
          extract="/tmp/vlrf-extract"

          curl -sL --fail \
            "https://github.com/${{ env.RAPIDFORT_DATA_OWNER }}/${{ env.RAPIDFORT_DATA_REPO }}/archive/main.tar.gz" \
            -o "${tarball}"
          mkdir -p "${extract}"
          tar -xzf "${tarball}" -C "${extract}" --strip-components=1

          if [ ! -d "${extract}/rapidfort" ]; then
            echo "ERROR: ${{ env.RAPIDFORT_DATA_OWNER }}/${{ env.RAPIDFORT_DATA_REPO }} has no rapidfort/ directory."
            echo "Did the vuln-list-update workflow run at least once? Aborting."
            exit 1
          fi

          cp -r "${extract}/rapidfort" cache/vuln-list/rapidfort

          echo "cache/vuln-list/ contents after overlay:"
          ls -la cache/vuln-list/
          echo "cache/vuln-list/rapidfort/ contents:"
          ls -la cache/vuln-list/rapidfort/

      - name: Build the binary
        run: make build

      - name: Build database
        run: make db-build

      - name: Compact DB
        run: make db-compact

      - name: Compress assets
        run: make db-compress

      - name: Move DB
        run: mv assets/db.tar.gz .

      - name: Login to GitHub Packages Container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install oras
        run: |
          curl -LO https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
          tar -xvf ./oras_1.2.0_linux_amd64.tar.gz

      - name: Push DB to GHCR
        # Publishes ghcr.io/<owner>/trivy-db under two tags:
        #   :latest         — floating pointer to newest build
        #   :${VERSION}     — schema version tag (currently :2). Trivy's DefaultGHCRRepository
        #                     includes ":2" — trivy-rf/pkg/db/db.go:31 must match this.
        run: |
          set -euo pipefail
          repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "Publishing to ${repo} with tags: latest, ${{ env.VERSION }}"

          for tag in latest ${{ env.VERSION }}; do
            echo "Pushing ${repo}:${tag}..."
            ./oras push \
              --artifact-type application/vnd.aquasec.trivy.config.v1+json \
              "${repo}:${tag}" \
              db.tar.gz:application/vnd.aquasec.trivy.db.layer.v1.tar+gzip
            echo "Pushed ${repo}:${tag}"
          done

